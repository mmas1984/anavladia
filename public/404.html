<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dra. Ana Vládia Brasileiro</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect: preserves path, query and hash
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var base = l.pathname.split('/')[1] ? '/' + l.pathname.split('/')[1] + '/' : '/';
      // Redirect back to index.html with route in hash or search
      window.location.replace(base + window.location.search + window.location.hash);
    </script>
  </head>
  <body style="background-color: #FAF6F3; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #2C1E18;">

  </body>
</html>
